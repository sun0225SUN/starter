services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: starter
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: starter
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U starter -d starter']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
