version: 2
updates:
  # Enable version updates for bun
  - package-ecosystem: bun
    # Look for `package.json` and `bun.lock` in the root directory
    directory: /
    # Check the registry for updates every month
    schedule:
      interval: monthly
      time: '06:00'
    # Limit the number of open pull requests for version updates to 1
    open-pull-requests-limit: 1
    # Commit message format
    commit-message:
      # Match Commitlint: `:package: build(deps): ...`
      prefix: ':package: build'
      include: scope
    # Group updates into a single pull request
    groups:
      # The name of the group (identifier)
      bun-deps:
        update-types: [minor, patch]
    # Only allow minor and patch updates
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # Enable version updates for GitHub Actions
  - package-ecosystem: github-actions
    # Look for `.github/workflows` in the root directory
    directory: /
    # Check GitHub Actions for updates every month
    schedule:
      interval: monthly
      time: '06:05'
    # Limit the number of open pull requests for version updates to 1
    open-pull-requests-limit: 1
    # Commit message format
    commit-message:
      # Match Commitlint: `:ferris_wheel: ci(deps): ...`
      prefix: ':ferris_wheel: ci'
      include: scope
